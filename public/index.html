<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASS NATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1B1F27; --muted:#6B7280; --amber:#E8873A; --amber-deep:#C96B22; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:#FFFFFF; color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .welcome{ text-align:center; max-width:420px; }
  .logo-placeholder{ width:96px; height:96px; margin:0 auto 24px; display:block; }
  h1{ font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-weight:700; font-size:34px; margin:0 0 8px; letter-spacing:.3px; }
  p.tag{ color:var(--muted); font-size:15px; margin:0 0 32px; line-height:1.5; }
  .btn{
    font-weight:600; font-size:15px; background:var(--amber); color:#1a1300;
    border:none; border-radius:12px; padding:14px 30px; cursor:pointer;
    text-decoration:none; display:inline-block;
  }
  .btn:hover{ background:var(--amber-deep); }
  .fleet-link{ display:block; margin-top:20px; color:var(--muted); font-size:13px; text-decoration:underline; }
</style>
</head>
<body>
  <div class="welcome">
    <!--
      ============================================================
      LOGO PLACEHOLDER — replace with the real HASS Nation logo.
      Simplest swap: delete the <svg class="logo-placeholder">...</svg>
      block below and replace it with:
        <img class="logo-placeholder" src="logo.svg" alt="HASS Nation logo">
      (drop the real file at public/logo.svg — or wherever you keep it —
      and point src at that path). The <svg> below is just a stand-in
      shape so the page isn't empty before the real asset exists.
      ============================================================
    -->
    <svg class="logo-placeholder" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="48" cy="48" r="45" fill="none" stroke="#E8873A" stroke-width="4"/>
      <path d="M48 22 L73 74 L48 60 L23 74 Z" fill="#E8873A"/>
    </svg>

    <h1>Karibu HASS Nation</h1>
    <p class="tag">The loyalty points console for HASS NATION fuel stations.</p>
    <a class="btn" id="btn-continue" href="login.html">Continue</a>
    <a class="fleet-link" href="fleet-login.html">Fleet manager? Log in here</a>
  </div>
</body>
</html>
