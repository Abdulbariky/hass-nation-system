<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASS NATION — Fleet Manager Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1B1F27; --muted:#6B7280; --line:#E5E7EB; --amber:#E8873A; --amber-deep:#C96B22; --bad:#C0392B; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:#FFFFFF; color:var(--ink); font-family:'Inter',-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:360px; text-align:center; }
  h1{ font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-weight:700; font-size:26px; margin:0 0 6px; }
  p.tag{ color:var(--muted); font-size:14px; margin:0 0 24px; line-height:1.5; }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .field input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14.5px; font-family:'Inter',sans-serif; }
  .field input:focus{ outline:none; border-color:var(--amber); }
  .btn{ width:100%; font-weight:600; font-size:14.5px; background:var(--amber); color:#1a1300; border:none; border-radius:12px; padding:13px 20px; cursor:pointer; margin-top:6px; }
  .btn:hover{ background:var(--amber-deep); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn-link{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; margin-top:16px; text-decoration:underline; }
  .error{ color:var(--bad); font-size:13px; margin-top:14px; min-height:16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Fleet manager login</h1>
    <p class="tag">Sign in with the phone number on file for your fleet account.</p>

    <div id="step-phone">
      <div class="field">
        <label for="fl-phone">Phone number</label>
        <input type="text" id="fl-phone" placeholder="e.g. 0712345678" autocomplete="tel">
      </div>
      <button class="btn" id="btn-fl-send">Send code</button>
    </div>

    <div id="step-otp" hidden>
      <p class="tag">Enter the 6-digit code sent to <strong id="fl-otp-phone"></strong>. With SMS_PROVIDER=console (the default), it prints to the server terminal instead.</p>
      <div class="field">
        <label for="fl-otp-code">Verification code</label>
        <input type="text" id="fl-otp-code" placeholder="e.g. 482913" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn" id="btn-fl-verify">Verify & continue</button>
      <button class="btn-link" id="btn-fl-back">Use a different number</button>
    </div>

    <div class="error" id="fl-error"></div>
  </div>
  <script>
    if (localStorage.getItem('hn_fleet_token')) {
      location.href = 'fleet-dashboard.html';
    }

    const phoneStep = document.getElementById('step-phone');
    const otpStep = document.getElementById('step-otp');
    const errorBox = document.getElementById('fl-error');
    const sendButton = document.getElementById('btn-fl-send');
    const verifyButton = document.getElementById('btn-fl-verify');
    let phone = '';

    async function postJson(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      return { ok: res.ok, data };
    }

    sendButton.addEventListener('click', async () => {
      errorBox.textContent = '';
      phone = document.getElementById('fl-phone').value.trim();
      if (!phone) { errorBox.textContent = 'Enter your phone number'; return; }

      sendButton.disabled = true;
      const result = await postJson('/api/fleet/auth/send-otp', { phone });
      sendButton.disabled = false;
      if (!result.ok) { errorBox.textContent = result.data.error || 'Could not send code'; return; }

      document.getElementById('fl-otp-phone').textContent = phone;
      phoneStep.hidden = true;
      otpStep.hidden = false;
    });

    document.getElementById('btn-fl-back').addEventListener('click', () => {
      errorBox.textContent = '';
      otpStep.hidden = true;
      phoneStep.hidden = false;
    });

    verifyButton.addEventListener('click', async () => {
      errorBox.textContent = '';
      const code = document.getElementById('fl-otp-code').value.trim();
      if (!code) { errorBox.textContent = 'Enter the code'; return; }

      verifyButton.disabled = true;
      const result = await postJson('/api/fleet/auth/verify-otp', { phone, code });
      verifyButton.disabled = false;
      if (!result.ok) { errorBox.textContent = result.data.error || 'Verification failed'; return; }

      localStorage.setItem('hn_fleet_token', result.data.token);
      localStorage.setItem('hn_fleet_account', JSON.stringify(result.data.account));
      location.href = 'fleet-dashboard.html';
    });

    document.getElementById('fl-otp-code').addEventListener('keydown', e => { if (e.key === 'Enter') verifyButton.click(); });
    document.getElementById('fl-phone').addEventListener('keydown', e => { if (e.key === 'Enter') sendButton.click(); });
  </script>
</body>
</html>
